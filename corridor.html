<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Museum Corridor</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="corridor">

        <header class="corridor-header">

            <p class="eyebrow">
                MUSEUM OF GENERATIONS
            </p>

            <h1>
                Museum Corridor
            </h1>

            <p>
                Choose a room to explore.
            </p>

        </header>


        <section class="doors-container">

            <div
                class="doors"
                id="doors">

                <button
                    class="door"
                    data-room="generation1.html">

                    <span>
                        Generation I
                    </span>

                </button>


                <button
                    class="door"
                    data-room="generation2.html">

                    <span>
                        Generation II
                    </span>

                </button>


                <button
                    class="door"
                    data-room="generation3.html">

                    <span>
                        Generation III
                    </span>

                </button>


                <button
                    class="door"
                    data-room="generation4.html">

                    <span>
                        Generation IV
                    </span>

                </button>


                <button
                    class="door"
                    data-room="generation5.html">

                    <span>
                        Generation V
                    </span>

                </button>


                <button
                    class="door"
                    data-room="future.html">

                    <span>
                        The Future
                    </span>

                </button>


                <button
                    class="door"
                    data-room="resources.html">

                    <span>
                        Resources
                    </span>

                </button>

            </div>

        </section>


        <div class="navigation">

            <button
                class="nav-button"
                id="leftButton">

                ←

            </button>


            <button
                class="nav-button"
                id="rightButton">

                →

            </button>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
